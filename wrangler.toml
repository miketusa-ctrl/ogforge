# Public template. Replace every <PLACEHOLDER> with your own Cloudflare resource IDs
# (wrangler kv namespace create / wrangler d1 create). Rate-limit namespace IDs must be
# unique integers within your account. Secrets go in `wrangler secret put`, never here.

name = "ogforge-staging"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true
preview_urls = false
minify = true

[limits]
cpu_ms = 1000

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.txt"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.woff"]
fallthrough = true

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[vars]
PUBLIC_LAUNCH = "false"
PAID_TIER_ENABLED = "false"
REQ_LIMIT_PER_MIN = "120"
RENDER_LIMIT_PER_MIN = "20"
GLOBAL_RENDER_LIMIT_PER_MIN = "60"
DENY_TERMS = ""
DENY_LOGO_HOSTS = ""
DENY_HASHES = ""
MCP_REGISTRY_AUTH = ""

[[kv_namespaces]]
binding = "OGFORGE_KV"
id = "<KV_NAMESPACE_ID>"

[[ratelimits]]
name = "REQ_LIMITER"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_1>"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RENDER_LIMITER"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_2>"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_3>"
simple = { limit = 60, period = 60 }

[env.production]
name = "ogforge"
workers_dev = true
preview_urls = false
minify = true

[env.production.limits]
cpu_ms = 1000

[env.production.vars]
PUBLIC_LAUNCH = "true"
PAID_TIER_ENABLED = "false"
REQ_LIMIT_PER_MIN = "120"
RENDER_LIMIT_PER_MIN = "20"
GLOBAL_RENDER_LIMIT_PER_MIN = "60"
DENY_TERMS = ""
DENY_LOGO_HOSTS = ""
DENY_HASHES = ""
MCP_REGISTRY_AUTH = ""

[[env.production.kv_namespaces]]
binding = "OGFORGE_KV"
id = "<PRODUCTION_KV_NAMESPACE_ID>"

[[env.production.ratelimits]]
name = "REQ_LIMITER"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_4>"
simple = { limit = 120, period = 60 }

[[env.production.ratelimits]]
name = "RENDER_LIMITER"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_5>"
simple = { limit = 20, period = 60 }

[[env.production.ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_6>"
simple = { limit = 60, period = 60 }
